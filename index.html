<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅游助手智能体</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-solid: #ffffff;
            --border-light: rgba(203, 213, 225, 0.5);
            --border-medium: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-teal: #0d9488;
            --accent-cyan: #0891b2;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --shadow-soft: 0 1px 3px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
        }

        .bg-decoration {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; overflow: hidden; pointer-events: none;
        }
        .bg-decoration::before {
            content: ''; position: absolute; top: -20%; right: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(13, 148, 136, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }
        .bg-decoration::after {
            content: ''; position: absolute; bottom: -10%; left: -5%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            border-radius: 50%;
        }
        .bg-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
            background-size: 80px 80px;
        }

        .container {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            height: 100vh; max-width: 1100px; margin: 0 auto;
        }

        .header {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            padding: 14px 24px;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, #0d9488, #0891b2);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; box-shadow: 0 2px 8px rgba(13, 148, 136, 0.25);
        }
        .logo h1 { margin: 0; font-size: 20px; font-weight: 700; color: var(--text-primary); }
        .logo-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn {
            padding: 8px 16px; border: 1px solid var(--border-medium);
            border-radius: 10px; cursor: pointer; font-size: 13px;
            font-weight: 500; transition: all 0.25s ease;
            display: flex; align-items: center; gap: 6px;
            background: var(--bg-card-solid); color: var(--text-secondary);
        }
        .btn:hover {
            background: var(--bg-secondary); border-color: var(--text-muted);
            color: var(--text-primary); transform: translateY(-1px); box-shadow: var(--shadow-soft);
        }
        .btn-primary {
            border-color: rgba(13, 148, 136, 0.3); color: var(--accent-teal);
            background: rgba(13, 148, 136, 0.05);
        }
        .btn-primary:hover {
            background: rgba(13, 148, 136, 0.1); border-color: rgba(13, 148, 136, 0.4);
            box-shadow: 0 2px 8px rgba(13, 148, 136, 0.15);
        }
        .btn-danger {
            border-color: rgba(239, 68, 68, 0.2); color: #ef4444;
            background: rgba(239, 68, 68, 0.03);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.3);
        }

        .main { flex: 1; display: flex; flex-direction: column; padding: 0 20px; overflow: hidden; }

        .messages-container {
            flex: 1; overflow-y: auto; padding: 24px 0;
            display: flex; flex-direction: column; gap: 16px;
        }

        .welcome-message { display: flex; justify-content: center; align-items: center; height: 100%; padding: 20px; }
        .welcome-card {
            background: var(--bg-card-solid); border: 1px solid var(--border-light);
            border-radius: 20px; padding: 40px; max-width: 520px;
            text-align: center; box-shadow: var(--shadow-soft); position: relative; overflow: hidden;
        }
        .welcome-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #0d9488, #0891b2, #3b82f6);
        }
        .welcome-icon { font-size: 56px; margin-bottom: 20px; display: inline-block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .welcome-card h2 { margin: 0 0 12px; font-size: 24px; font-weight: 700; color: var(--text-primary); }
        .welcome-card > p { color: var(--text-secondary); margin-bottom: 8px; font-size: 15px; }

        .feature-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; text-align: left; }
        .feature-item {
            background: var(--bg-secondary); border: 1px solid var(--border-light);
            border-radius: 12px; padding: 14px; font-size: 13px;
            color: var(--text-secondary); transition: all 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .feature-item:hover {
            background: #ffffff; border-color: rgba(13, 148, 136, 0.2);
            box-shadow: var(--shadow-soft); transform: translateY(-1px);
        }

        /* 路线信息样式 */
        .route-info-container {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid rgba(13, 148, 136, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin: 12px 0;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.08);
        }
        .route-header {
            border-bottom: 1px solid rgba(13, 148, 136, 0.1);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .route-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-teal);
            margin-bottom: 8px;
        }
        .route-summary {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .route-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .route-stat-item {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(13, 148, 136, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .route-details {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(13, 148, 136, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .route-details-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-teal);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(13, 148, 136, 0.1);
        }
        .route-detail-section {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 12px 0 8px 0;
            padding: 8px 12px;
            background: rgba(13, 148, 136, 0.05);
            border-radius: 8px;
            border-left: 3px solid var(--accent-teal);
        }
        .route-detail-item {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 6px 0;
            padding-left: 12px;
            line-height: 1.5;
        }
        .train-info {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, rgba(59, 130, 246, 0.02) 100%);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 12px;
            padding: 16px;
        }
        .train-info-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
        }
        .train-scheme {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 6px 0;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            line-height: 1.5;
        }
        .feature-item .emoji { font-size: 18px; flex-shrink: 0; }

        .welcome-tip {
            margin-top: 16px; color: var(--text-muted); font-size: 13px;
            padding: 12px 16px; background: rgba(13, 148, 136, 0.04);
            border-radius: 10px; border: 1px solid rgba(13, 148, 136, 0.1);
        }

        .message-item { display: flex; gap: 12px; margin-bottom: 4px; animation: messageSlide 0.3s ease-out; }
        @keyframes messageSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-item.user { flex-direction: row-reverse; }

        .message-avatar {
            width: 36px; height: 36px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px; flex-shrink: 0; box-shadow: var(--shadow-soft);
        }
        .message-avatar.user { background: linear-gradient(135deg, #0891b2, #0d9488); }
        .message-avatar.assistant { background: linear-gradient(135deg, #8b5cf6, #ec4899); }

        .message-content { flex: 1; max-width: 75%; }
        .message-item.user .message-content { text-align: right; }

        .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 0 4px; }
        .message-name { font-weight: 600; font-size: 13px; color: var(--text-secondary); }
        .message-time { font-size: 11px; color: var(--text-muted); }

        .message-text {
            background: var(--bg-card-solid); border: 1px solid var(--border-light);
            padding: 14px 18px; border-radius: 16px; border-top-left-radius: 4px; box-shadow: var(--shadow-soft);
        }
        .message-item.user .message-text {
            background: linear-gradient(135deg, #f0fdfa, #ecfeff);
            border-color: rgba(8, 145, 178, 0.15);
            border-top-left-radius: 16px; border-top-right-radius: 4px;
        }

        .text-content { line-height: 1.7; white-space: pre-wrap; font-size: 14px; color: var(--text-primary); }
        .message-intent { margin-top: 10px; text-align: left; }

        .tag {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
        }
        .tag-info { background: rgba(148, 163, 184, 0.12); color: var(--text-secondary); border: 1px solid rgba(148, 163, 184, 0.2); }
        .tag-primary { background: rgba(13, 148, 136, 0.1); color: var(--accent-teal); border: 1px solid rgba(13, 148, 136, 0.2); }
        .tag-success { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.2); }
        .tag-warning { background: rgba(245, 158, 11, 0.1); color: var(--accent-orange); border: 1px solid rgba(245, 158, 11, 0.2); }
        .tag-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }

        .loading-dots { display: flex; gap: 6px; padding: 6px 0; }
        .loading-dots span {
            width: 8px; height: 8px;
            background: linear-gradient(135deg, #0d9488, #0891b2);
            border-radius: 50%; animation: loadingPulse 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes loadingPulse { 0%,80%,100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        .input-area {
            background: var(--bg-card-solid); border-top: 1px solid var(--border-light);
            padding: 16px 24px; margin-bottom: 8px;
            border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
        }
        .input-container { display: flex; gap: 12px; align-items: flex-end; }
        .input-wrapper { flex: 1; position: relative; }

        .message-input {
            width: 100%; min-height: 48px; max-height: 120px;
            padding: 12px 16px; padding-right: 60px;
            border: 1px solid var(--border-medium); border-radius: 14px;
            font-size: 14px; line-height: 1.5; resize: none; font-family: inherit;
            background: var(--bg-primary); color: var(--text-primary); transition: all 0.3s;
        }
        .message-input::placeholder { color: var(--text-muted); }
        .message-input:focus {
            outline: none; border-color: rgba(13, 148, 136, 0.4);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.08); background: #ffffff;
        }

        .char-count { position: absolute; bottom: 10px; right: 14px; font-size: 11px; color: var(--text-muted); pointer-events: none; }

        .send-btn {
            padding: 12px 20px; background: linear-gradient(135deg, #0d9488, #0891b2);
            color: #ffffff; border: none; border-radius: 14px; cursor: pointer;
            font-size: 14px; font-weight: 600; transition: all 0.3s;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 10px rgba(13, 148, 136, 0.25);
        }
        .send-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(13, 148, 136, 0.35); }
        .send-btn:active:not(:disabled) { transform: translateY(0); }
        .send-btn:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; }

        .modal {
            display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(6px);
            animation: fadeIn 0.2s ease;
        }
        .modal.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: var(--bg-card-solid); margin: 8% auto; padding: 28px;
            border-radius: 20px; width: 85%; max-width: 520px;
            position: relative; box-shadow: var(--shadow-hover);
            border: 1px solid var(--border-light); animation: modalSlide 0.3s ease;
        }
        @keyframes modalSlide { from { opacity: 0; transform: translateY(-20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; color: var(--text-primary); font-size: 18px; font-weight: 700; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: all 0.2s; }
        .close-btn:hover { color: var(--text-primary); background: var(--bg-secondary); }

        .intent-item {
            padding: 16px; border: 1px solid var(--border-light);
            border-radius: 12px; margin-bottom: 12px;
            background: var(--bg-secondary); transition: all 0.3s;
        }
        .intent-item:hover {
            background: #ffffff; border-color: rgba(13, 148, 136, 0.2); box-shadow: var(--shadow-soft);
        }
        .intent-header { margin-bottom: 8px; }
        .intent-description { margin: 8px 0; color: var(--text-secondary); font-size: 14px; line-height: 1.5; }
        .intent-example { font-size: 13px; color: var(--text-muted); padding: 8px 12px; background: var(--bg-primary); border-radius: 8px; border-left: 3px solid var(--accent-teal); }

        .error-content { padding: 20px 0; text-align: center; }
        .error-alert { background: rgba(239, 68, 68, 0.06); border: 1px solid rgba(239, 68, 68, 0.15); border-radius: 10px; padding: 16px; color: #dc2626; font-size: 14px; }

        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .header-content { flex-direction: column; gap: 10px; }
            .main { padding: 0 12px; }
            .message-content { max-width: 85%; }
            .welcome-card { padding: 28px 20px; }
            .feature-list { grid-template-columns: 1fr; }
            .input-area { padding: 12px 16px; }
            .input-container { gap: 8px; }
            .modal-content { width: 92%; margin: 15% auto; padding: 20px; }
        }

        .messages-container::-webkit-scrollbar { width: 5px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 10px; }
        .messages-container::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }

        .status-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); animation: statusPulse 2s infinite; }
        .status-dot.offline { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); animation: none; }
        @keyframes statusPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="bg-decoration"><div class="bg-grid"></div></div>

    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">✈️</div>
                    <div>
                        <h1>旅游助手智能体</h1>
                        <div class="logo-subtitle">AI 驱动的智能旅行规划 · 高德地图 + Tavily 搜索 + RAG</div>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="status-indicator" id="statusIndicator">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">连接中...</span>
                    </div>
                    <button class="btn" onclick="showHistoryModal()">
                        <span>📋</span> 历史
                    </button>
                    <button class="btn btn-primary" onclick="showIntentsModal()">
                        <span>ℹ️</span> 功能介绍
                    </button>
                    <button class="btn" onclick="getGPSLocation()" id="gpsBtn" title="获取当前GPS位置">
                        <span>📍</span> 定位
                    </button>
                    <button class="btn btn-danger" onclick="clearChat()">
                        <span>🗑️</span> 清空
                    </button>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message" id="welcomeMessage">
                    <div class="welcome-card">
                        <div class="welcome-icon">🌍</div>
                        <h2>开启您的智能旅程</h2>
                        <p>我可以为您提供以下服务：</p>
                        <div class="feature-list">
                            <div class="feature-item"><span class="emoji">🗺️</span>驾车/公交/火车路线规划</div>
                            <div class="feature-item"><span class="emoji">🔍</span>Tavily 深度旅游搜索</div>
                            <div class="feature-item"><span class="emoji">🏞️</span>景点/美食/住宿推荐</div>
                            <div class="feature-item"><span class="emoji">🧠</span>搜索结果整合</div>
                        </div>
                        <div class="welcome-tip">
                            💡 试试输入：<strong>"北京到上海的路线，顺便推荐旅游攻略"</strong>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea id="messageInput" class="message-input"
                            placeholder="输入您的问题，如：北京到上海的路线..."
                            rows="2" maxlength="500" onkeydown="handleKeyDown(event)"></textarea>
                        <div class="char-count"><span id="charCount">0</span>/500</div>
                    </div>
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled>
                        <span>➤</span> 发送
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="intentsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✨ 功能介绍</h3>
                <button class="close-btn" onclick="closeIntentsModal()">&times;</button>
            </div>
            <div id="intentsContent"></div>
        </div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content" style="max-width:600px;max-height:80vh;display:flex;flex-direction:column;">
            <div class="modal-header">
                <h3>📋 对话历史</h3>
                <button class="close-btn" onclick="closeHistoryModal()">&times;</button>
            </div>
            <div id="historyList" style="flex:1;overflow-y:auto;min-height:200px;">
                <div style="text-align:center;color:var(--text-muted);padding:40px;">加载中...</div>
            </div>
            <div style="display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-light);">
                <button class="btn" onclick="refreshHistory()" style="flex:1;justify-content:center;">🔄 刷新</button>
                <button class="btn btn-danger" onclick="clearAllHistory()" style="flex:1;justify-content:center;">🗑️ 清空所有</button>
            </div>
        </div>
    </div>

    <div id="errorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚠️ 提示</h3>
                <button class="close-btn" onclick="closeErrorModal()">&times;</button>
            </div>
            <div class="error-content">
                <div class="error-alert" id="errorMessage">发生错误</div>
            </div>
            <div style="text-align:center;margin-top:20px;">
                <button class="btn btn-primary" onclick="closeErrorModal()">确定</button>
            </div>
        </div>
    </div>

    <script>
        let isLoading = false;
        let intents = [];
        // 当前会话 ID（localStorage 持久化，刷新页面后仍可续接同一会话）
        let currentSessionId = localStorage.getItem('travel_session_id') || '';

        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const charCount = document.getElementById('charCount');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // 自动检测 API 基础路径
        const API_BASE = (function() {
            const scripts = document.getElementsByTagName('script');
            // 如果是通过 /ui/ 访问的，API 在 / 下
            // 如果是直接打开 index.html，默认为 localhost:8000
            const path = window.location.pathname;
            if (path.startsWith('/ui/') || path === '/ui' || path === '/ui/index.html') {
                return ''; // 同源代理
            }
            return 'http://localhost:8000';
        })();

        document.addEventListener('DOMContentLoaded', function() {
            messageInput.addEventListener('input', updateCharCount);
            messageInput.addEventListener('input', updateSendBtnState);
            loadIntents();
            checkServiceStatus();
            // 每 30 秒轮询服务状态
            setInterval(checkServiceStatus, 30000);
            // 打开网页自动获取 GPS 定位
            setTimeout(autoGetGPS, 500);
        });

        // 打开网页自动获取 GPS 定位（无需手动点击按钮）
        function autoGetGPS() {
            if (!navigator.geolocation) return;
            if (window._cachedGPS) return; // 已有缓存不再重复获取
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    // 1. 缓存经纬度
                    window._cachedGPS = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    
                    try {
                        // 2. 调用逆地理编码接口，获取完整地址
                        const locResp = await fetch(`${API_BASE}/location?lat=${window._cachedGPS.lat}&lng=${window._cachedGPS.lng}`);
                        const locData = await locResp.json();
                        
                        if (locData.status === 'success') {
                            // 3. 缓存完整地址（统一字段名称）
                            window._cachedAddress = {
                                province: locData.province || '',
                                city: locData.city || '',
                                district: locData.district || '',
                                township: locData.township || '',
                                street: locData.street || '',
                                streetNumber: locData.street_number || '',
                                neighborhood: locData.neighborhood || '',
                                building: locData.building || '',
                                fullAddress: locData.full_address || '',
                                detailedAddress: locData.detailed_address || ''
                            };
                            console.log(`📍 已自动获取位置:`, window._cachedAddress);
                            
                            // 更新定位按钮状态
                            const gpsBtn = document.getElementById('gpsBtn');
                            if (gpsBtn) {
                                gpsBtn.innerHTML = `<span>📍</span> ${window._cachedAddress.city || '已定位'}`;
                                setTimeout(() => { 
                                    gpsBtn.innerHTML = '<span>📍</span> 定位'; 
                                }, 3000);
                            }
                        }
                    } catch (err) {
                        console.warn('逆地理编码失败:', err);
                    }
                },
                (err) => {
                    console.warn('GPS定位失败:', err.message);
                }
            );
        }
        

        function updateCharCount() {
            const length = messageInput.value.length;
            charCount.textContent = length;
            charCount.style.color = length > 450 ? '#dc2626' : '';
        }

        function updateSendBtnState() {
            sendBtn.disabled = !messageInput.value.trim() || isLoading;
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function scrollToBottom() {
            setTimeout(() => { messagesContainer.scrollTop = messagesContainer.scrollHeight; }, 100);
        }

        function addMessage(type, content, intent = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message-item ${type}`;
            const time = getCurrentTime();

            let intentHtml = '';
            if (intent && intent !== 'unknown') {
                intentHtml = `<div class="message-intent"><span class="tag tag-${getIntentType(intent)}">● ${getIntentName(intent)}</span></div>`;
            }

            messageDiv.innerHTML = `
                <div class="message-avatar ${type}">${type === 'user' ? '👤' : '🤖'}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-name">${type === 'user' ? '我' : '旅游助手'}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text">
                        <div class="text-content">${intent === 'route' ? formatRouteContent(content) : escapeHtml(content)}</div>
                        ${intentHtml}
                    </div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            if (welcomeMessage) welcomeMessage.style.display = 'none';
            scrollToBottom();
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            messageInput.value = '';
            updateCharCount();
            updateSendBtnState();
            addMessage('user', message);

            isLoading = true;

            // 创建一个 AI 消息容器，里面先显示加载动画
            const assistantDiv = document.createElement('div');
            assistantDiv.className = 'message-item assistant';
            const time = getCurrentTime();
            assistantDiv.innerHTML = `
                <div class="message-avatar assistant">🤖</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-name">旅游助手</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text">
                        <div class="loading-dots"><span></span><span></span><span></span></div>
                        <div class="text-content" id="streamContent" style="display:none"></div>
                        <div class="message-intent" id="streamIntent"></div>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(assistantDiv);
            if (welcomeMessage) welcomeMessage.style.display = 'none';
            scrollToBottom();

            const loadingDots = assistantDiv.querySelector('.loading-dots');
            const contentDiv = assistantDiv.querySelector('#streamContent');
            const intentDiv = assistantDiv.querySelector('#streamIntent');

            // 构造请求体：包含消息和缓存的GPS坐标
            const body = {
                message: message,
                // 会话 ID：续接同一会话（多轮记忆）
                session_id: currentSessionId,
                // 经纬度（原有）
                gps_lat: window._cachedGPS?.lat,
                gps_lng: window._cachedGPS?.lng,
                // 新增：完整地址信息
                address: {
                    province: window._cachedAddress?.province || '',
                    city: window._cachedAddress?.city || '',
                    district: window._cachedAddress?.district || '',
                    township: window._cachedAddress?.township || '',
                    street: window._cachedAddress?.street || '',
                    streetNumber: window._cachedAddress?.streetNumber || '',
                    neighborhood: window._cachedAddress?.neighborhood || '',
                    building: window._cachedAddress?.building || '',
                    fullAddress: window._cachedAddress?.fullAddress || '',
                    detailedAddress: window._cachedAddress?.detailedAddress || ''
                }
            };
            try {
                const response = await fetch(API_BASE + '/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (!response.ok) throw new Error(`请求失败 (${response.status})`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let partialText = '';
                let finalIntent = '';
                let hasContent = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    let currentEventType = '';
                    for (const line of lines) {
                        if (line.startsWith('event: ')) {
                            currentEventType = line.slice(7).trim();
                            continue;
                        }
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));

                                if (currentEventType === 'step') {
                                    if (!hasContent) {
                                        loadingDots.style.display = 'none';
                                        contentDiv.style.display = '';
                                        hasContent = true;
                                    }
                                    // 状态提示仅作临时占位，首个 partial 到达后即被正文替换（不混入正文）
                                    contentDiv.textContent = data.message || '';
                                    scrollToBottom();
                                } else if (currentEventType === 'partial') {
                                    if (!hasContent) {
                                        loadingDots.style.display = 'none';
                                        contentDiv.style.display = '';
                                        hasContent = true;
                                    }
                                    partialText += data.text;
                                    // formatRouteContent 返回安全 HTML（路线→结构化；非路线→转义文本）
                                    contentDiv.innerHTML = formatRouteContent(partialText);
                                    scrollToBottom();
                                } else if (currentEventType === 'done') {
                                    finalIntent = data.intent || '';
                                    if (data.session_id && data.session_id !== currentSessionId) {
                                        currentSessionId = data.session_id;
                                        localStorage.setItem('travel_session_id', currentSessionId);
                                    }
                                    if (finalIntent && finalIntent !== 'unknown') {
                                        intentDiv.innerHTML = `<span class="tag tag-${getIntentType(finalIntent)}">● ${escapeHtml(getIntentName(finalIntent))}</span>`;
                                    }
                                } else if (currentEventType === 'error') {
                                    showError(data.error || '处理失败');
                                }
                                currentEventType = '';
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }

                // 确保加载动画被隐藏
                if (!hasContent) {
                    loadingDots.style.display = 'none';
                    contentDiv.style.display = '';
                    // 对于路线规划意图，使用HTML格式化显示
                    if (finalIntent === 'route') {
                        contentDiv.innerHTML = formatRouteContent(partialText || '暂无回复');
                    } else {
                        contentDiv.textContent = partialText || '暂无回复';
                    }
                }
            } catch (error) {
                console.error('流式请求失败:', error);
                loadingDots.style.display = 'none';
                contentDiv.style.display = '';
                contentDiv.textContent = '请求失败: ' + (error.message || '网络错误，请确认后端服务已启动');
            } finally {
                isLoading = false;
                updateSendBtnState();
            }
        }

        function clearChat() {
            if (!confirm('确定要清空当前对话并开启新会话吗？')) return;
            const items = messagesContainer.querySelectorAll('.message-item');
            items.forEach(item => item.remove());
            if (welcomeMessage) welcomeMessage.style.display = 'flex';
            // 开启新会话：重置 session_id，后续请求将创建新会话
            currentSessionId = '';
            localStorage.removeItem('travel_session_id');
        }

        function getIntentType(intent) {
            const map = { 'chat': 'info', 'route': 'primary', 'search': 'success', 'travel': 'warning' };
            return map[intent] || 'info';
        }

        function getIntentName(intent) {
            const map = { 'chat': '💬 普通聊天', 'route': '🗺️ 路线规划', 'search': '🔍 旅游搜索', 'travel': '🌍 综合规划' };
            return map[intent] || intent;
        }

        function formatRouteContent(content) {
            /**
             * 格式化路线规划内容，提取并美化路线详情
             * 契约：输入纯文本 → 输出安全 HTML（路线→结构化容器；非路线→转义文本）
             * 关键词与后端 ROUTE_SYSTEM_PROMPT / route_planner 输出格式匹配（LLM 自由输出，宽松匹配）
             */
            if (!content || typeof content !== 'string') return escapeHtml(content);

            // 检测是否为路线规划内容（第1段/总统计/车次等后端实际输出标记）
            if (!/第[123]段|总统计|路线规划|路线详情|车次|推荐高铁|火车出行/.test(content)) {
                return escapeHtml(content);
            }

            // 创建路线信息容器
            const routeContainer = document.createElement('div');
            routeContainer.className = 'route-info-container';

            // 分割内容行
            const lines = content.split('\n');
            let currentSection = '';
            let headerCreated = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // 总览标题：第1段 / 路线规划 开头行
                if (!headerCreated && /第1段|路线规划/.test(line)) {
                    const routeHeader = document.createElement('div');
                    routeHeader.className = 'route-header';
                    const routeTitle = document.createElement('div');
                    routeTitle.className = 'route-title';
                    routeTitle.textContent = '🗺️ 路线规划';
                    const routeSummary = document.createElement('div');
                    routeSummary.className = 'route-summary';
                    routeSummary.textContent = line;
                    routeHeader.appendChild(routeTitle);
                    routeHeader.appendChild(routeSummary);
                    routeContainer.appendChild(routeHeader);
                    headerCreated = true;
                    continue;
                }

                // 统计行：总距离/总耗时/总费用/距离:/用时:/费用:
                if (/总距离|总耗时|总费用|距离[:：]|用时[:：]|费用[:：]|📏|⏱️|💰/.test(line)) {
                    if (!routeContainer.querySelector('.route-stats')) {
                        const statsContainer = document.createElement('div');
                        statsContainer.className = 'route-stats';
                        routeContainer.appendChild(statsContainer);
                    }
                    const statItem = document.createElement('div');
                    statItem.className = 'route-stat-item';
                    statItem.textContent = line;
                    routeContainer.querySelector('.route-stats').appendChild(statItem);
                    continue;
                }

                // 路线详情块
                if (/路线详情/.test(line)) {
                    currentSection = 'details';
                    const detailsContainer = document.createElement('div');
                    detailsContainer.className = 'route-details';
                    const detailsTitle = document.createElement('div');
                    detailsTitle.className = 'route-details-title';
                    detailsTitle.textContent = line.includes('📋') ? line : '📋 路线详情';
                    detailsContainer.appendChild(detailsTitle);
                    routeContainer.appendChild(detailsContainer);
                    continue;
                }

                // 火车方案块（已存在则把该行作为车次条目加入）
                if (/推荐高铁|火车出行|第2段：火车|车次/.test(line)) {
                    currentSection = 'train';
                    const existingTrain = routeContainer.querySelector('.train-info');
                    if (!existingTrain) {
                        const trainContainer = document.createElement('div');
                        trainContainer.className = 'train-info';
                        const trainTitle = document.createElement('div');
                        trainTitle.className = 'train-info-title';
                        trainTitle.textContent = '🚄 推荐火车出行方案';
                        trainContainer.appendChild(trainTitle);
                        routeContainer.appendChild(trainContainer);
                    } else {
                        const trainItem = document.createElement('div');
                        trainItem.className = 'train-scheme';
                        trainItem.textContent = line;
                        existingTrain.appendChild(trainItem);
                    }
                    continue;
                }

                // 详情/火车块内的内容行（安全构建：textContent 防注入）
                if (currentSection === 'details' || currentSection === 'train') {
                    const item = document.createElement('div');
                    item.className = currentSection === 'details' ? 'route-detail-item' : 'train-scheme';
                    if (currentSection === 'details' && /【.*】/.test(line)) {
                        item.className = 'route-detail-section';
                    }
                    item.textContent = line;
                    const container = routeContainer.querySelector(
                        currentSection === 'details' ? '.route-details' : '.train-info'
                    );
                    if (container) container.appendChild(item);
                }
            }

            return routeContainer.outerHTML;
        }

        function getIntentExample(intent) {
            const map = {
                'chat': '你好、介绍一下自己',
                'route': '北京到上海的驾车路线、杭州到南京怎么走',
                'search': '杭州西湖有什么好玩的、西安美食推荐',
                'travel': '北京到上海的路线，顺便推荐旅游攻略'
            };
            return map[intent] || '';
        }

        async function loadIntents() {
            try {
                const resp = await fetch(API_BASE + '/intents');
                if (resp.ok) {
                    const data = await resp.json();
                    intents = data.intents;
                    updateIntentsModal();
                }
            } catch (e) { console.error('加载意图失败:', e); }
        }

        function updateIntentsModal() {
            const content = document.getElementById('intentsContent');
            if (!content || intents.length === 0) return;
            content.innerHTML = intents.map(it => `
                <div class="intent-item">
                    <div class="intent-header"><span class="tag tag-${getIntentType(it.id)}">● ${it.name}</span></div>
                    <p class="intent-description">${it.description}</p>
                    <div class="intent-example"><strong>示例：</strong>${it.example || getIntentExample(it.id)}</div>
                </div>
            `).join('');
        }

        function showIntentsModal() { document.getElementById('intentsModal').classList.add('show'); }
        function closeIntentsModal() { document.getElementById('intentsModal').classList.remove('show'); }

        function showError(msg) {
            document.getElementById('errorMessage').textContent = msg;
            document.getElementById('errorModal').classList.add('show');
        }
        function closeErrorModal() { document.getElementById('errorModal').classList.remove('show'); }

        async function checkServiceStatus() {
            try {
                const resp = await fetch(API_BASE + '/health');
                if (resp.ok) {
                    statusDot.classList.remove('offline');
                    statusText.textContent = '服务在线';
                } else {
                    statusDot.classList.add('offline');
                    statusText.textContent = '服务异常';
                }
            } catch (e) {
                statusDot.classList.add('offline');
                statusText.textContent = '离线';
            }
        }

        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) e.target.classList.remove('show');
        };

        // ════════════════════════════════════
        // 对话历史记忆功能
        // ════════════════════════════════════

        async function loadHistory() {
            try {
                const resp = await fetch(API_BASE + '/memory/sessions');
                if (!resp.ok) throw new Error('加载失败');
                const data = await resp.json();
                return data.sessions || [];
            } catch (e) {
                console.error('加载历史失败:', e);
                return [];
            }
        }

        async function loadSessionDetail(sessionId) {
            try {
                const resp = await fetch(API_BASE + '/memory/sessions/' + sessionId);
                if (!resp.ok) throw new Error('加载失败');
                return await resp.json();
            } catch (e) {
                console.error('加载会话详情失败:', e);
                return null;
            }
        }

        async function showHistoryModal() {
            document.getElementById('historyModal').classList.add('show');
            refreshHistory();
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.remove('show');
        }

        async function refreshHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px;">⏳ 加载中...</div>';
            const sessions = await loadHistory();
            if (sessions.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px;">📭 暂无对话记录</div>';
                return;
            }
            list.innerHTML = sessions.map(s => `
                <div class="history-item" onclick="viewSession('${s.id}')"
                     style="padding:14px;border:1px solid var(--border-light);border-radius:12px;margin-bottom:10px;cursor:pointer;background:var(--bg-secondary);transition:all 0.2s;">
                    <div style="font-weight:600;font-size:14px;color:var(--text-primary);margin-bottom:4px;">
                        ${escapeHtml(s.title)}
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);display:flex;gap:12px;">
                        <span>💬 ${s.msg_count} 条</span>
                        <span>🕐 ${formatTime(s.updated_at)}</span>
                    </div>
                </div>
            `).join('');
        }

        async function viewSession(sessionId) {
            const detail = await loadSessionDetail(sessionId);
            if (!detail) return;

            const list = document.getElementById('historyList');
            let html = '<div style="margin-bottom:12px;">';
            html += `<button class="btn" onclick="refreshHistory()" style="font-size:12px;padding:6px 12px;">⬅ 返回列表</button>`;
            html += ` <span style="font-weight:600;font-size:14px;">${escapeHtml(detail.title)}</span>`;
            html += '</div><hr style="border:none;border-top:1px solid var(--border-light);margin:8px 0;">';

            for (const msg of detail.messages) {
                const isUser = msg.role === 'user';
                html += `<div style="margin:8px 0;padding:10px 14px;border-radius:10px;background:${isUser ? 'rgba(8,145,178,0.06)' : 'var(--bg-card-solid)'};border:1px solid var(--border-light);">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">
                        ${isUser ? '👤 我' : '🤖 助手'} · ${formatTime(msg.timestamp)}
                        ${msg.intent ? `<span class="tag tag-${getIntentType(msg.intent)}" style="font-size:10px;margin-left:6px;">${escapeHtml(getIntentName(msg.intent))}</span>` : ''}
                    </div>
                    <div style="font-size:13px;line-height:1.6;color:var(--text-primary);white-space:pre-wrap;word-break:break-word;">${escapeHtml(msg.content)}</div>
                </div>`;
            }

            html += '<div style="text-align:center;margin-top:12px;">';
            html += `<button class="btn btn-danger" onclick="deleteSession('${sessionId}')" style="font-size:12px;">🗑️ 删除此会话</button>`;
            html += '</div>';

            list.innerHTML = html;
        }

        async function deleteSession(sessionId) {
            if (!confirm('确定要删除此会话吗？')) return;
            try {
                await fetch(API_BASE + '/memory/sessions/' + sessionId, { method: 'DELETE' });
                refreshHistory();
            } catch (e) {
                alert('删除失败');
            }
        }

        async function clearAllHistory() {
            if (!confirm('确定要清空所有对话记录吗？此操作不可恢复。')) return;
            try {
                await fetch(API_BASE + '/memory/sessions', { method: 'DELETE' });
                // 清空本地会话引用，下次发送将开启新会话
                currentSessionId = '';
                localStorage.removeItem('travel_session_id');
                refreshHistory();
            } catch (e) {
                alert('清空失败');
            }
        }

        function formatTime(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // ===== GPS 定位功能 =====
        // 获取当前位置（浏览器 Geolocation API）
        function getGPSLocation() {
            const gpsBtn = document.getElementById('gpsBtn');
            gpsBtn.disabled = true;
            gpsBtn.innerHTML = '<span>⏳</span> 定位中...';

            if (!navigator.geolocation) {
                showError('当前浏览器不支持GPS定位');
                gpsBtn.disabled = false;
                gpsBtn.innerHTML = '<span>📍</span> 定位';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // 缓存GPS坐标到全局变量，供 sendMessage() 自动携带
                    window._cachedGPS = { lat, lng };

                    // 发送到后端逆地理编码获取完整地址信息
                    try {
                        const resp = await fetch(`${API_BASE}/location?lat=${lat}&lng=${lng}`);
                        const data = await resp.json();
                        if (data.status === 'success') {
                            // 缓存完整的地址信息
                            window._cachedAddress = {
                                province: data.province || '',
                                city: data.city || '',
                                district: data.district || '',
                                township: data.township || '',
                                street: data.street || '',
                                streetNumber: data.street_number || '',
                                neighborhood: data.neighborhood || '',
                                building: data.building || '',
                                fullAddress: data.full_address || '',
                                detailedAddress: data.detailed_address || ''
                            };

                            // ✅ 只在控制台输出，不覆盖用户已输入的内容
                            console.log("📍 GPS 定位成功：", window._cachedAddress.city);
                            console.log("📍 完整地址：", window._cachedAddress.detailedAddress);
                        } else {
                            // ✅ 控制台输出，不弹消息
                            console.log("📍 GPS 坐标：", lat, lng);
                        }
                    } catch (e) {
                        // ✅ 错误也只在控制台显示
                        console.log("📍 GPS 定位异常", e);
                    }

                    gpsBtn.disabled = false;
                    gpsBtn.innerHTML = '<span>📍</span> 已定位';
                    setTimeout(() => { gpsBtn.innerHTML = '<span>📍</span> 定位'; }, 3000);
                },
                (error) => {
                    let msg = '定位失败';
                    switch (error.code) {
                        case error.PERMISSION_DENIED: msg = '用户拒绝了定位权限'; break;
                        case error.POSITION_UNAVAILABLE: msg = '位置信息不可用'; break;
                        case error.TIMEOUT: msg = '定位请求超时'; break;
                        default: msg = error.message;
                    }
                    showError(`GPS定位失败: ${msg}`);
                    gpsBtn.disabled = false;
                    gpsBtn.innerHTML = '<span>📍</span> 定位';
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
    </script>
</body>
</html>
